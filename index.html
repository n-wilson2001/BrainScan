<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive 3D brain explorer: click any region to learn what it does.">
<title>Brain Explorer</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <h1>🧠 Brain Explorer <span>Click any region to learn what it does</span></h1>
  <div class="controls">
    <button id="btn-xray" aria-pressed="false" title="See through the outer brain">X-ray</button>
    <button id="btn-explode" aria-pressed="false" title="Pull the parts apart">Explode</button>
    <button id="btn-labels" aria-pressed="true">Labels</button>
    <button id="btn-spin" aria-pressed="true">Spin</button>
    <button id="btn-reset">Reset view</button>
    <input type="search" id="search" placeholder="Search (e.g. memory, balance)" aria-label="Search brain regions">
  </div>
</header>

<main>
  <section id="stage" aria-label="Interactive 3D brain. Drag to rotate, scroll to zoom, click a region.">
    <div id="loading">Loading the 3D brain…</div>
    <div class="hint">Drag to rotate · Scroll to zoom · Click a region</div>
  </section>

  <aside>
    <div class="panel" id="info" aria-live="polite"></div>
    <div class="panel list" id="list"></div>
  </aside>
</main>

<div id="tooltip"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.3/build/index.module.js"
  }
}
</script>

<script type="module" src="js/main.js"></script>
</body>
</html>
